<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <title>Devět bran k pochopení pohybu</title>
  <link rel="stylesheet" href="css/style.css?v=0.20">
</head>
<body>
  <div id="app">

    <!-- Vstup: první kliknutí odemkne zvuk (pravidlo prohlížečů) -->
    <section id="enter" class="screen" hidden>
      <div class="enter-wrap">
        <button id="btn-enter" class="enter-btn" type="button">Vstoupit</button>
        <p class="enter-note">Hra má zvuk – nejlépe se sluchátky. Vypnout ho lze kdykoli tlačítkem Zvuk.</p>
        <button id="btn-enter-silent" class="link" type="button">Vstoupit bez zvuku</button>
      </div>
    </section>

    <!-- Úvodní průchod tmou skrze brány -->
    <section id="intro" class="screen" hidden>
      <canvas class="tunnel" id="tunnel"></canvas>
      <p class="intro-line" id="intro-line"></p>
      <button class="skip" id="intro-skip" type="button">Přeskočit ›</button>
    </section>

    <!-- Titulní obrazovka -->
    <section id="title" class="screen" hidden>
      <div class="title-wrap">
        <h1 class="game-title" id="game-title"></h1>
        <p class="game-subtitle" id="game-subtitle"></p>
        <nav class="menu">
          <button id="btn-continue" type="button">Pokračovat</button>
          <button id="btn-new" type="button">Nová hra</button>
          <button id="btn-intro" type="button">Přehrát úvod</button>
        </nav>
        <p class="shortcut-note" id="shortcut-note" hidden></p>
      </div>
      <p class="version" id="version"></p>
      <button class="hud-btn title-sound" id="btn-sound-title" type="button" aria-pressed="true">Zvuk</button>
    </section>

    <!-- Výběr sekce (civilní / vojenská) -->
    <section id="track" class="screen" hidden>
      <div class="track-wrap">
        <h2>Kdo vstupuje?</h2>
        <label class="team">
          <span>Název týmu <small>(nepovinné)</small></span>
          <input id="team-name" maxlength="40" autocomplete="off" spellcheck="false">
        </label>
        <div class="tracks" id="tracks"></div>
        <button class="link" id="track-back" type="button">‹ Zpět</button>
        <button class="link track-all" id="track-all" type="button" hidden>Všechny světy od začátku</button>
      </div>
    </section>

    <!-- Místnost -->
    <section id="room" class="screen" hidden>
      <header class="hud">
        <div class="hud-title">
          <span class="gate-num" id="hud-gate"></span>
          <span id="hud-room"></span>
        </div>
        <div class="hud-actions">
          <button id="btn-notes" class="hud-btn" type="button">Zápisník</button>
          <button id="btn-light" class="hud-btn" type="button" aria-pressed="true">Baterka</button>
          <button id="btn-sound" class="hud-btn" type="button" aria-pressed="true">Zvuk</button>
          <button id="btn-menu" class="hud-btn" type="button">Menu</button>
        </div>
      </header>
      <div class="stage" id="stage">
        <div class="scene" id="scene">
          <img class="scene-bg" id="scene-bg" alt="">
          <div class="scene-layers" id="scene-layers"></div>
          <canvas class="scene-dark" id="scene-dark"></canvas>
          <canvas class="scene-dust" id="scene-dust"></canvas>
          <div class="scene-storm" id="scene-storm" aria-hidden="true"></div>
          <div class="hotspots" id="hotspots"></div>
          <div class="scene-nav" id="scene-nav"></div>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
      </div>
      <div class="message" id="message" aria-live="polite"></div>
      <div class="inventory" id="inventory" aria-label="Inventář"></div>
    </section>

    <!-- Závěrečná obrazovka -->
    <section id="finish" class="screen" hidden>
      <div class="finish-wrap">
        <h2 id="finish-title"></h2>
        <p class="finish-text" id="finish-text"></p>
        <dl class="stats" id="finish-stats"></dl>
        <p class="photo-hint" id="finish-photo"></p>
        <button id="btn-again" type="button">Nová hra</button>
      </div>
    </section>

    <!-- Chyba při načtení obsahu -->
    <section id="fatal" class="screen" hidden>
      <div class="fatal-wrap">
        <h2>Hru se nepodařilo spustit</h2>
        <p id="fatal-text"></p>
      </div>
    </section>
  </div>

  <!-- Modální okno (detail, zámek, zápisník, menu) -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="cursor-item" id="cursor-item" hidden><img alt=""></div>

  <script src="js/engine.js?v=0.20"></script>
  <script src="js/audio.js?v=0.20"></script>
  <script src="js/calc.js?v=0.20"></script>
  <script src="js/brany.js?v=0.20"></script>
  <script src="js/ui.js?v=0.20"></script>
</body>
</html>
