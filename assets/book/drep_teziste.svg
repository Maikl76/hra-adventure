<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Obrázek do knihy Fyzika dřepu: stoj a dřep z boku, pokles těžiště h (inkoust na průhledném pozadí) -->
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a2e1e"/>
    </marker>
  </defs>
  <g fill="none" stroke="#3a2c1c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="150" cy="40" r="17"/>
    <path d="M150,57 L150,150 L150,270 M150,95 L186,95"/>
    <circle cx="340" cy="100" r="17"/>
    <path d="M340,117 L360,170 L312,206 L340,270 M360,170 L398,152"/>
  </g>
  <line x1="40" y1="272" x2="560" y2="272" stroke="#3a2c1c" stroke-width="3"/>
  <circle cx="150" cy="140" r="9" fill="#7a2e1e"/>
  <circle cx="345" cy="185" r="9" fill="#7a2e1e"/>
  <g stroke="#3a2c1c" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="150" y1="140" x2="470" y2="140"/><line x1="345" y1="185" x2="470" y2="185"/>
  </g>
  <line x1="455" y1="143" x2="455" y2="182" stroke="#7a2e1e" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <g font-family="Georgia, serif" fill="#3a2c1c">
    <text x="470" y="170" font-size="28" font-style="italic">h ≈ 0,4 m</text>
    <text x="150" y="296" text-anchor="middle" font-size="18">stoj</text>
    <text x="340" y="296" text-anchor="middle" font-size="18">dřep (90° v koleni)</text>
    <text x="40" y="146" font-size="16">těžiště</text>
  </g>
  <path d="M95,140 L136,140" stroke="#3a2c1c" stroke-width="1.5"/>
</svg>
