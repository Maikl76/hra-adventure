<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290">
  <!-- Obrázek do knihy: rovnováha momentů na předloktí (inkoust na průhledném pozadí) -->
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a2e1e"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a2c1c"/>
    </marker>
  </defs>
  <g font-family="Georgia, serif" fill="#3a2c1c">
    <line x1="90" y1="150" x2="540" y2="150" stroke="#3a2c1c" stroke-width="12" stroke-linecap="round"/>
    <circle cx="90" cy="150" r="17" fill="#e8dcbc" stroke="#3a2c1c" stroke-width="3"/>
    <g stroke="#3a2c1c" stroke-width="2.5"><line x1="80" y1="150" x2="100" y2="150"/><line x1="90" y1="140" x2="90" y2="160"/></g>
    <text x="66" y="124" text-anchor="end" font-size="24">osa</text>

    <line x1="160" y1="140" x2="160" y2="34" stroke="#7a2e1e" stroke-width="6" marker-end="url(#tip)"/>
    <text x="176" y="56" font-size="30" font-style="italic">F<tspan baseline-shift="sub" font-size="19">sval</tspan></text>

    <circle cx="500" cy="114" r="26" fill="none" stroke="#3a2c1c" stroke-width="3.5"/>
    <line x1="500" y1="160" x2="500" y2="226" stroke="#7a2e1e" stroke-width="6" marker-end="url(#tip)"/>
    <text x="350" y="212" font-size="30" font-style="italic">F<tspan baseline-shift="sub" font-size="19">břemeno</tspan></text>

    <g stroke="#3a2c1c" stroke-width="1.5" stroke-dasharray="4 5">
      <line x1="90" y1="170" x2="90" y2="282"/><line x1="160" y1="160" x2="160" y2="196"/><line x1="500" y1="234" x2="500" y2="282"/>
    </g>
    <line x1="93" y1="190" x2="157" y2="190" stroke="#3a2c1c" stroke-width="2.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="170" y="198" font-size="26" font-style="italic">r<tspan baseline-shift="sub" font-size="17">sval</tspan></text>
    <line x1="93" y1="274" x2="497" y2="274" stroke="#3a2c1c" stroke-width="2.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="290" y="264" text-anchor="middle" font-size="26" font-style="italic">r<tspan baseline-shift="sub" font-size="17">břemeno</tspan></text>
  </g>
</svg>
