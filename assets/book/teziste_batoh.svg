<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290">
  <!-- Obrázek do knihy: společné těžiště dvou těles (inkoust na průhledném pozadí) -->
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3a2a14"/>
    </marker>
  </defs>
  <g font-family="Georgia, serif" fill="#3a2a14">
    <!-- osa -->
    <line x1="60" y1="200" x2="560" y2="200" stroke="#3a2a14" stroke-width="2"/>
    <!-- těleso 1 (voják) -->
    <circle cx="430" cy="140" r="52" fill="none" stroke="#3a2a14" stroke-width="3"/>
    <text x="430" y="148" font-size="24" text-anchor="middle" font-style="italic">m₁</text>
    <line x1="430" y1="192" x2="430" y2="208" stroke="#3a2a14" stroke-width="3"/>
    <text x="430" y="232" font-size="18" text-anchor="middle">x₁ = 0</text>
    <!-- těleso 2 (batoh) -->
    <circle cx="170" cy="160" r="30" fill="none" stroke="#3a2a14" stroke-width="3"/>
    <text x="170" y="167" font-size="20" text-anchor="middle" font-style="italic">m₂</text>
    <line x1="170" y1="192" x2="170" y2="208" stroke="#3a2a14" stroke-width="3"/>
    <text x="170" y="232" font-size="18" text-anchor="middle">x₂</text>
    <!-- společné těžiště -->
    <polygon points="352,200 340,222 364,222" fill="#7a2e1e"/>
    <text x="352" y="250" font-size="18" text-anchor="middle" fill="#7a2e1e">x_T</text>
    <text x="352" y="272" font-size="14" text-anchor="middle" fill="#7a2e1e">blíž k těžšímu</text>
    <!-- vzdálenost -->
    <line x1="176" y1="60" x2="424" y2="60" stroke="#3a2a14" stroke-width="1.5" marker-start="url(#tip)" marker-end="url(#tip)"/>
    <line x1="170" y1="48" x2="170" y2="128" stroke="#3a2a14" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="430" y1="48" x2="430" y2="86" stroke="#3a2a14" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="300" y="50" font-size="16" text-anchor="middle">vzdálenost těžišť</text>
  </g>
</svg>
