<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Detail: měření na modelu paže. Měřítko: 30 cm = 400 jednotek (loket x=250, úpon x=290, závaží x=650). -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2a1f14"/>
      <stop offset="1" stop-color="#0b0806"/>
    </radialGradient>
    <radialGradient id="metal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e2ddd1"/>
      <stop offset="0.4" stop-color="#8d8a82"/>
      <stop offset="1" stop-color="#2c2b28"/>
    </radialGradient>
    <pattern id="cm" x="250" y="0" width="13.3333" height="30" patternUnits="userSpaceOnUse">
      <line x1="0.6" y1="0" x2="0.6" y2="8" stroke="#3a2a14" stroke-width="1.2"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e6c67e"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect y="470" width="800" height="30" fill="#2b1b0f"/>

  <!-- Stojan -->
  <rect x="243" y="335" width="14" height="135" fill="#55524a"/>
  <rect x="205" y="462" width="90" height="10" rx="2" fill="#3a3a36"/>

  <!-- Paže -->
  <rect x="228" y="60" width="44" height="250" rx="20" fill="#bfae95"/>
  <circle cx="250" cy="68" r="26" fill="#bfae95"/>
  <path d="M258,92 C 305,140 312,240 293,298 L 283,298 C 292,240 284,150 250,112 Z" fill="#8a4a3a"/>
  <polygon points="250,292 650,298 650,326 250,334" fill="#bfae95"/>
  <ellipse cx="662" cy="312" rx="26" ry="18" fill="#bfae95"/>
  <circle cx="650" cy="262" r="34" fill="url(#metal)"/>
  <circle cx="250" cy="313" r="22" fill="#a8967c" stroke="#6a5d4a" stroke-width="2"/>
  <g stroke="#e6c67e" stroke-width="2"><line x1="241" y1="313" x2="259" y2="313"/><line x1="250" y1="304" x2="250" y2="322"/></g>
  <circle cx="290" cy="300" r="6" fill="#e6c67e"/>

  <!-- Pravítko přiložené pod předloktím -->
  <rect x="236" y="340" width="430" height="30" rx="3" fill="#b08a52" stroke="#6b5230" stroke-width="2"/>
  <rect x="250" y="340" width="401" height="30" fill="url(#cm)"/>
  <g stroke="#3a2a14" stroke-width="1.6">
    <line x1="250" y1="340" x2="250" y2="354"/><line x1="316.7" y1="340" x2="316.7" y2="354"/>
    <line x1="383.3" y1="340" x2="383.3" y2="354"/><line x1="450" y1="340" x2="450" y2="354"/>
    <line x1="516.7" y1="340" x2="516.7" y2="354"/><line x1="583.3" y1="340" x2="583.3" y2="354"/>
    <line x1="650" y1="340" x2="650" y2="354"/>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#3a2a14" text-anchor="middle">
    <text x="250" y="366">0</text><text x="316.7" y="366">5</text><text x="383.3" y="366">10</text>
    <text x="450" y="366">15</text><text x="516.7" y="366">20</text><text x="583.3" y="366">25</text><text x="650" y="366">30</text>
  </g>

  <!-- Kóty -->
  <g stroke="#e6c67e" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7">
    <line x1="250" y1="336" x2="250" y2="452"/><line x1="290" y1="306" x2="290" y2="412"/><line x1="650" y1="300" x2="650" y2="452"/>
  </g>
  <line x1="252" y1="402" x2="288" y2="402" stroke="#e6c67e" stroke-width="2" marker-start="url(#tip)" marker-end="url(#tip)"/>
  <text x="300" y="408" font-family="Georgia, serif" font-size="18" fill="#e6c67e">3 cm</text>
  <line x1="252" y1="442" x2="648" y2="442" stroke="#e6c67e" stroke-width="2" marker-start="url(#tip)" marker-end="url(#tip)"/>
  <text x="450" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#e6c67e">30 cm</text>

  <!-- Popisky -->
  <g font-family="Georgia, serif" font-size="16" fill="#e8dcc4">
    <text x="220" y="300" text-anchor="end">osa loketního</text>
    <text x="220" y="320" text-anchor="end">kloubu</text>
    <line x1="333" y1="252" x2="296" y2="294" stroke="#e8dcc4" stroke-width="1"/>
    <text x="338" y="248">úpon svalu – síla F = ?</text>
    <text x="650" y="212" text-anchor="middle">závaží</text>
  </g>
</svg>
