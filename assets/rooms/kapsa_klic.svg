<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">
  <!-- Vrstva: klíček vyčuhující z kapsy (zmizí, když ho hráč vezme). Stejný rozměr jako detail kapsy. -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6df9c"/><stop offset="0.45" stop-color="#c9a45c"/><stop offset="1" stop-color="#6e5628"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5530"/><stop offset="1" stop-color="#4a2a14"/>
    </linearGradient>
  </defs>
  <!-- stín klíčku na látce -->
  <g transform="translate(10 16) rotate(-18 900 300)" opacity="0.22" fill="#000">
    <circle cx="700" cy="300" r="62"/>
    <rect x="740" y="288" width="340" height="26" rx="8"/>
    <rect x="1010" y="300" width="70" height="60"/>
  </g>
  <!-- klíček: oko (trojlístek), dřík a zuby; zuby mizí v kapse -->
  <g transform="rotate(-18 900 300)">
    <circle cx="700" cy="300" r="60" fill="url(#brass)"/>
    <circle cx="700" cy="300" r="30" fill="#bdb39c"/>
    <circle cx="652" cy="262" r="22" fill="url(#brass)"/>
    <circle cx="652" cy="338" r="22" fill="url(#brass)"/>
    <circle cx="700" cy="300" r="30" fill="none" stroke="#6e5628" stroke-width="4"/>
    <rect x="752" y="288" width="330" height="24" rx="8" fill="url(#brass)"/>
    <rect x="760" y="282" width="18" height="36" rx="4" fill="url(#brass)"/>
    <path d="M1010,312 L1010,352 L1028,352 L1028,334 L1046,334 L1046,360 L1064,360 L1064,334 L1082,334 L1082,312 Z" fill="url(#brass)"/>
    <path d="M752,290 L1080,290" stroke="#fff3c8" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- kožený přívěsek s vyraženým Š na kroužku -->
  <circle cx="618" cy="372" r="20" fill="none" stroke="#b89a5a" stroke-width="6"/>
  <g transform="rotate(10 600 450)">
    <rect x="545" y="390" width="110" height="104" rx="16" fill="url(#leather)" stroke="#2e180a" stroke-width="4"/>
    <circle cx="600" cy="406" r="7" fill="#1e1006"/>
    <text x="600" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="bold" fill="#2a160a" opacity="0.85">Š</text>
  </g>
</svg>
