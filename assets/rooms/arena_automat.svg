<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">
  <!-- GSPORT LEVEL 2 – Skokanská aréna: automat JUMP s kontaktní deskou, měřič, stupnice, žebříček. Zástupná kresba (viz docs/zadani-obrazku-arena.md). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1724"/>
      <stop offset="1" stop-color="#0f0d14"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2616"/>
      <stop offset="1" stop-color="#22160c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1418"/>
      <stop offset="1" stop-color="#08070a"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1672" height="941">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1672" height="820" fill="url(#wall)"/>
  <rect y="560" width="1672" height="260" fill="url(#wood)"/>
  <g stroke="#160e07" stroke-width="3">
    <line x1="0" y1="560" x2="1672" y2="560"/>
    <line x1="140" y1="560" x2="140" y2="820"/><line x1="420" y1="560" x2="420" y2="820"/><line x1="700" y1="560" x2="700" y2="820"/>
    <line x1="980" y1="560" x2="980" y2="820"/><line x1="1260" y1="560" x2="1260" y2="820"/><line x1="1540" y1="560" x2="1540" y2="820"/>
  </g>
  <rect y="820" width="1672" height="121" fill="url(#floor)"/>
  <line x1="0" y1="820" x2="1672" y2="820" stroke="#05040a" stroke-width="4"/>

  <!-- neonová lišta pod stropem -->
  <line x1="300" y1="44" x2="1370" y2="44" stroke="#ff4fd8" stroke-width="15" opacity="0.45" filter="url(#glow)" stroke-linecap="round"/>
  <line x1="300" y1="44" x2="1370" y2="44" stroke="#ff4fd8" stroke-width="5" stroke-linecap="round"/>

  <!-- žebříček na zdi -->
  <rect x="90" y="180" width="240" height="180" rx="6" fill="#06090d" stroke="#3fe0ff" stroke-width="3"/>
  <g fill="#1d5b6b"><rect x="110" y="200" width="150" height="10"/><rect x="110" y="225" width="190" height="8"/><rect x="110" y="245" width="180" height="8"/><rect x="110" y="265" width="170" height="8"/><rect x="110" y="300" width="120" height="8" fill="#6b2a5c"/><rect x="110" y="320" width="160" height="8" fill="#6b2a5c"/></g>
  <!-- měřič kontaktní desky na stolku -->
  <rect x="370" y="700" width="160" height="14" fill="#3a2a1a"/>
  <rect x="380" y="714" width="10" height="106" fill="#2a1d10"/><rect x="510" y="714" width="10" height="106" fill="#2a1d10"/>
  <rect x="380" y="560" width="140" height="140" rx="8" fill="#2a2d33" stroke="#0d0e10" stroke-width="3"/>
  <rect x="398" y="578" width="104" height="40" rx="3" fill="#0b0f0c" stroke="#555a60" stroke-width="2"/>
  <rect x="398" y="636" width="46" height="52" rx="3" fill="#0a0a0c" stroke="#555a60" stroke-width="2"/>
  <text x="421" y="667" font-family="Arial" font-size="12" fill="#5a6066" text-anchor="middle">9 V</text>
  <circle cx="500" cy="662" r="10" fill="#111" stroke="#777" stroke-width="2"/>
  <!-- kabel od desky – volný konec bez konektoru -->
  <path d="M560,885 C500,885 468,868 468,820 L468,772" fill="none" stroke="#151515" stroke-width="9" stroke-linecap="round"/>
  <path d="M468,772 l-6,-10 M468,772 l0,-12 M468,772 l6,-10" stroke="#b07a3a" stroke-width="2"/>
  <!-- automat JUMP -->
  <polygon points="700,240 980,240 980,820 700,820" fill="#1d1630" stroke="#0a0812" stroke-width="4"/>
  <polygon points="980,240 1000,255 1000,820 980,820" fill="#140f22"/>
  <rect x="700" y="160" width="280" height="80" rx="6" fill="#120d1e" stroke="#2a2040" stroke-width="3"/>
  <text x="840" y="218" font-family="Arial Black, Arial" font-weight="bold" font-size="52" fill="#5a2050" text-anchor="middle" letter-spacing="6">JUMP</text>
  <rect x="735" y="260" width="210" height="160" rx="8" fill="#050508" stroke="#3a3050" stroke-width="4"/>
  <polygon points="720,430 960,430 975,480 705,480" fill="#2a2240" stroke="#0a0812" stroke-width="3"/>
  <circle cx="790" cy="455" r="12" fill="#3a1030"/><circle cx="840" cy="455" r="12" fill="#10303a"/><circle cx="890" cy="455" r="12" fill="#3a3010"/>
  <rect x="800" y="600" width="80" height="80" rx="4" fill="#120e1c" stroke="#3a3050" stroke-width="2"/>
  <rect x="832" y="620" width="16" height="30" rx="3" fill="#2a2a2a"/>
  <!-- kamera na střeše automatu -->
  <rect x="815" y="128" width="50" height="32" rx="5" fill="#111" stroke="#444" stroke-width="2"/>
  <circle cx="840" cy="144" r="10" fill="#0a1a22" stroke="#3a6a7a" stroke-width="2"/>
  <!-- neonová stupnice (zhasnutá) -->
  <rect x="1010" y="200" width="40" height="600" rx="8" fill="#0b0b12" stroke="#2a2a3a" stroke-width="3"/>
  <g stroke="#2a3a44" stroke-width="3">
    <line x1="1014" y1="800" x2="1046" y2="800"/>
    <line x1="1014" y1="700" x2="1046" y2="700"/>
    <line x1="1014" y1="600" x2="1046" y2="600"/>
    <line x1="1014" y1="500" x2="1046" y2="500"/>
    <line x1="1014" y1="400" x2="1046" y2="400"/>
    <line x1="1014" y1="300" x2="1046" y2="300"/>
    <line x1="1014" y1="200" x2="1046" y2="200"/>
  </g>
  <g stroke="#1f2a30" stroke-width="2">
    <line x1="1020" y1="800" x2="1040" y2="800"/>
    <line x1="1020" y1="750" x2="1040" y2="750"/>
    <line x1="1020" y1="700" x2="1040" y2="700"/>
    <line x1="1020" y1="650" x2="1040" y2="650"/>
    <line x1="1020" y1="600" x2="1040" y2="600"/>
    <line x1="1020" y1="550" x2="1040" y2="550"/>
    <line x1="1020" y1="500" x2="1040" y2="500"/>
    <line x1="1020" y1="450" x2="1040" y2="450"/>
    <line x1="1020" y1="400" x2="1040" y2="400"/>
    <line x1="1020" y1="350" x2="1040" y2="350"/>
    <line x1="1020" y1="300" x2="1040" y2="300"/>
    <line x1="1020" y1="250" x2="1040" y2="250"/>
    <line x1="1020" y1="200" x2="1040" y2="200"/>
  </g>
  <g font-family="Arial" font-size="16" fill="#3a4a54">
    <text x="1060" y="805">0</text>
    <text x="1060" y="705">10</text>
    <text x="1060" y="605">20</text>
    <text x="1060" y="505">30</text>
    <text x="1060" y="405">40</text>
    <text x="1060" y="305">50</text>
    <text x="1060" y="205">60</text>
  </g>
  <!-- kontaktní deska na podlaze -->
  <polygon points="560,840 1120,840 1150,915 530,915" fill="#0f0f10" stroke="#b39400" stroke-width="5"/>
  <polygon points="590,852 1092,852 1114,903 566,903" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <!-- tabule rekordů -->
  <rect x="1180" y="180" width="340" height="240" fill="#3a2814" stroke="#20150a" stroke-width="8"/>
  <rect x="1196" y="196" width="308" height="208" fill="#1e2a22"/>
  <g stroke="#c9c9b0" stroke-width="2" opacity="0.6"><line x1="1220" y1="230" x2="1480" y2="230"/><line x1="1220" y1="270" x2="1420" y2="270"/><line x1="1220" y1="300" x2="1440" y2="300"/><line x1="1220" y1="340" x2="1460" y2="340"/><line x1="1220" y1="370" x2="1380" y2="370"/></g>
  <!-- herní křeslo -->
  <path d="M1300,540 Q1290,520 1310,515 L1450,515 Q1470,520 1460,540 L1440,700 L1320,700 Z" fill="#1a1a22" stroke="#0a0a0e" stroke-width="3"/>
  <path d="M1310,540 L1450,540" stroke="#ff4fd8" stroke-width="3" opacity="0.6"/>
  <rect x="1280" y="700" width="200" height="40" rx="12" fill="#222230" stroke="#0a0a0e" stroke-width="3"/>
  <rect x="1372" y="740" width="16" height="60" fill="#333"/>
  <path d="M1300,815 L1460,815 M1380,800 L1310,830 M1380,800 L1450,830" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <path d="M1270,690 q-10,40 30,50" fill="none" stroke="#c9c9c9" stroke-width="10" opacity="0.7"/>
</svg>
