  <!-- Tělocvična – skříň s náčiním, lavička a dveře (Brána II). Zástupná kresba (lze nahradit obrázkem 1672 × 941 se stejným rozvržením,
       viz docs/zadani-obrazku-telocvicna.md). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3bfa8"/>
      <stop offset="1" stop-color="#a39f88"/>
    </linearGradient>
    <linearGradient id="dado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#557560"/>
      <stop offset="1" stop-color="#3c5646"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07c43"/>
      <stop offset="1" stop-color="#6e4824"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e6e6"/>
      <stop offset="0.5" stop-color="#9aa0a2"/>
      <stop offset="1" stop-color="#5e6466"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c79a5e"/>
      <stop offset="1" stop-color="#a77840"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ead2"/>
      <stop offset="1" stop-color="#d9cfae"/>
    </linearGradient>
    <radialGradient id="tubeGlow">
      <stop offset="0" stop-color="#f4fff6" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#e6f5ea" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e6f5ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="locker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7c72"/>
      <stop offset="1" stop-color="#55615a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b6a44"/>
      <stop offset="1" stop-color="#6e5232"/>
    </linearGradient>
  </defs>

