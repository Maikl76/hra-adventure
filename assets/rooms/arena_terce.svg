<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">
  <!-- GSPORT LEVEL 2 – neonová střelnice: automat NEON AIM s dotykovou obrazovkou a výdejním okénkem, plakát, police s přístroji. Zástupná kresba. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1724"/>
      <stop offset="1" stop-color="#0f0d14"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2616"/>
      <stop offset="1" stop-color="#22160c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1418"/>
      <stop offset="1" stop-color="#08070a"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1672" height="941">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1672" height="820" fill="url(#wall)"/>
  <rect y="560" width="1672" height="260" fill="url(#wood)"/>
  <g stroke="#160e07" stroke-width="3">
    <line x1="0" y1="560" x2="1672" y2="560"/>
    <line x1="140" y1="560" x2="140" y2="820"/><line x1="420" y1="560" x2="420" y2="820"/><line x1="700" y1="560" x2="700" y2="820"/>
    <line x1="980" y1="560" x2="980" y2="820"/><line x1="1260" y1="560" x2="1260" y2="820"/><line x1="1540" y1="560" x2="1540" y2="820"/>
  </g>
  <rect y="820" width="1672" height="121" fill="url(#floor)"/>
  <line x1="0" y1="820" x2="1672" y2="820" stroke="#05040a" stroke-width="4"/>

  <line x1="120" y1="44" x2="1550" y2="44" stroke="#3fe0ff" stroke-width="12" opacity="0.45" filter="url(#glow)" stroke-linecap="round"/>
  <line x1="120" y1="44" x2="1550" y2="44" stroke="#3fe0ff" stroke-width="4" stroke-linecap="round"/>

  <!-- plakát -->
  <rect x="150" y="180" width="280" height="380" fill="#d9d0b8" stroke="#2a2418" stroke-width="4"/>
  <text x="290" y="226" font-family="Georgia, serif" font-weight="bold" font-size="24" fill="#2a2418" text-anchor="middle">RYCHLOST</text>
  <text x="290" y="256" font-family="Georgia, serif" font-weight="bold" font-size="24" fill="#2a2418" text-anchor="middle">× PŘESNOST</text>
  <circle cx="220" cy="350" r="44" fill="none" stroke="#c43a7a" stroke-width="5"/><circle cx="220" cy="350" r="14" fill="#c43a7a"/>
  <circle cx="380" cy="470" r="12" fill="none" stroke="#2a8aa8" stroke-width="4"/><circle cx="380" cy="470" r="4" fill="#2a8aa8"/>
  <path d="M245,385 Q300,440 360,462" fill="none" stroke="#2a2418" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="290" y="535" font-family="Georgia, serif" font-size="17" fill="#2a2418" text-anchor="middle">malý a daleko = pomaleji</text>
  <!-- automat NEON AIM -->
  <rect x="520" y="190" width="630" height="630" fill="#14101f" stroke="#08060e" stroke-width="5"/>
  <rect x="520" y="120" width="630" height="70" rx="6" fill="#0e0a18" stroke="#2a2040" stroke-width="3"/>
  <text x="835" y="172" font-family="Arial Black, Arial" font-weight="bold" font-size="46" fill="#204a5a" text-anchor="middle" letter-spacing="8">NEON AIM</text>
  <rect x="570" y="210" width="530" height="350" rx="10" fill="#04060a" stroke="#2a3a50" stroke-width="5"/>
  <circle cx="660" cy="300" r="40" fill="none" stroke="#1e4250" stroke-width="3"/><circle cx="660" cy="300" r="16" fill="none" stroke="#3a1e40" stroke-width="2"/>
  <circle cx="860" cy="420" r="22" fill="none" stroke="#1e4250" stroke-width="3"/><circle cx="860" cy="420" r="9" fill="none" stroke="#3a1e40" stroke-width="2"/>
  <circle cx="1010" cy="280" r="30" fill="none" stroke="#1e4250" stroke-width="3"/><circle cx="1010" cy="280" r="12" fill="none" stroke="#3a1e40" stroke-width="2"/>
  <circle cx="760" cy="500" r="16" fill="none" stroke="#1e4250" stroke-width="3"/><circle cx="760" cy="500" r="6" fill="none" stroke="#3a1e40" stroke-width="2"/>
  <circle cx="980" cy="500" r="46" fill="none" stroke="#1e4250" stroke-width="3"/><circle cx="980" cy="500" r="18" fill="none" stroke="#3a1e40" stroke-width="2"/>
  <rect x="560" y="570" width="550" height="40" rx="4" fill="#221a36"/>
  <!-- výdejní okénko -->
  <rect x="760" y="620" width="150" height="80" rx="6" fill="#06050a" stroke="#3a3050" stroke-width="4"/>
  <g stroke="#2a2440" stroke-width="3"><line x1="770" y1="640" x2="900" y2="640"/><line x1="770" y1="660" x2="900" y2="660"/><line x1="770" y1="680" x2="900" y2="680"/></g>
  <text x="835" y="740" font-family="Arial" font-size="18" fill="#4a3a60" text-anchor="middle">VÝHRA</text>
  <!-- police s přístroji -->
  <g fill="#3a2616" stroke="#1a1008" stroke-width="2"><rect x="1250" y="250" width="310" height="14"/><rect x="1250" y="460" width="310" height="14"/><rect x="1250" y="686" width="310" height="14"/></g>
  <rect x="1270" y="330" width="170" height="130" rx="6" fill="#3a3c40" stroke="#151618" stroke-width="3"/>
  <rect x="1286" y="346" width="100" height="80" fill="#0c1a10"/>
  <path d="M1290,386 q12,-28 24,0 t24,0 t24,0 t20,0" fill="none" stroke="#5aff6a" stroke-width="2"/>
  <circle cx="1410" cy="370" r="10" fill="#222"/><circle cx="1410" cy="406" r="10" fill="#222"/>
  <rect x="1460" y="380" width="80" height="80" fill="#2a2418" stroke="#151008" stroke-width="2"/>
  <path d="M1280,686 C1300,600 1360,640 1380,560 M1340,686 C1360,620 1420,650 1450,580" fill="none" stroke="#111" stroke-width="5"/>
</svg>
