<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">
  <!-- Vrstva: v UV světle se objevil nápis nad kostrou a šipka ke dveřím (k pojistkové skříni).
       Kostra v herna_stanice.webp: x 240–445, lebka nahoře u y 100; šipka vede nad kamerou stanice. -->
  <defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g filter="url(#glow)" fill="none" stroke="#c6ff6b" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <text x="345" y="72" text-anchor="middle" font-family="Comic Sans MS, Segoe Print, cursive" font-size="40" fill="#c6ff6b" stroke="none">KOLIK NÁS JE?</text>
    <path d="M425,250 q60,-10 100,-6" stroke-width="5"/>
    <path d="M640,240 h460" stroke-width="5" stroke-dasharray="26 18"/>
    <path d="M1120,240 h50 m-24,-18 l24,18 l-24,18" stroke-width="6"/>
  </g>
</svg>
