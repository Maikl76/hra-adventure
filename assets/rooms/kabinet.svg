<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Anatomický kabinet – zástupná grafika (lze nahradit obrázkem 16:9 se stejným rozvržením) -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1610"/>
      <stop offset="1" stop-color="#120e0a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f0a"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3b22"/>
      <stop offset="1" stop-color="#33210f"/>
    </linearGradient>
    <linearGradient id="doorwood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c1c0f"/>
      <stop offset="0.5" stop-color="#3f2916"/>
      <stop offset="1" stop-color="#26180c"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="moonglow">
      <stop offset="0" stop-color="#d7e0ee" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#9fb4d6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9fb4d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd28a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd28a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="metal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d9d4c8"/>
      <stop offset="0.4" stop-color="#8d8a82"/>
      <stop offset="1" stop-color="#2c2b28"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c67e"/>
      <stop offset="1" stop-color="#7d6535"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
