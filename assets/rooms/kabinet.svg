  <rect x="1445" y="450" width="34" height="80" rx="4" fill="#8a6f3a" stroke="#c9a45c" stroke-width="2"/>
  <circle cx="1462" cy="476" r="11" fill="#5a4a2a" stroke="#e6c67e" stroke-width="2"/>
  <line x1="1462" y1="476" x2="1462" y2="467" stroke="#e6c67e" stroke-width="2"/>
