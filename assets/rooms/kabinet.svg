  <rect x="380" y="140" width="240" height="540" fill="#24170e" stroke="#3a2716" stroke-width="3"/>
  <rect x="400" y="165" width="200" height="360" fill="#0c0d0d"/>
  <g>
    <rect x="410" y="185" width="16" height="67" fill="#4b2e22"/><rect x="428" y="195" width="12" height="57" fill="#2f3a2c"/>
    <rect x="442" y="180" width="20" height="72" fill="#3b3328"/><rect x="464" y="192" width="14" height="60" fill="#5a4630"/>
