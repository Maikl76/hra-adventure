  <polygon points="1090,511 1158,506 1161,512 1092,516" fill="#e0d6bd" opacity="0.6"/>
  <polygon points="1096,506 1150,503 1154,509 1098,511" fill="#d6caa9" opacity="0.6"/>
  <polygon points="1112,516 1152,515 1149,548 1110,545" fill="#ddd2b4" opacity="0.55"/>
  <g stroke="#6a5d48" stroke-width="1.5" opacity="0.5">
    <line x1="1117" y1="524" x2="1144" y2="524"/><line x1="1117" y1="531" x2="1140" y2="531"/><line x1="1117" y1="538" x2="1143" y2="538"/>
  </g>

  <!-- Světlo lampy -->
