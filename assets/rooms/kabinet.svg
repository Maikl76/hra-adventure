    <ellipse cx="480" cy="313" rx="8" ry="7" fill="#1a1410"/><ellipse cx="500" cy="313" rx="8" ry="7" fill="#1a1410"/>
    <path d="M487,322 L490,330 L493,322 Z" fill="#1a1410"/>
    <g stroke="#6f6553" stroke-width="1.5"><line x1="481" y1="334" x2="481" y2="340"/><line x1="487" y1="334" x2="487" y2="340"/><line x1="493" y1="334" x2="493" y2="340"/><line x1="499" y1="334" x2="499" y2="340"/></g>
    <rect x="550" y="300" width="30" height="42" rx="5" fill="#2c3a30" opacity="0.9"/><rect x="548" y="294" width="34" height="8" fill="#5a4a35"/>
