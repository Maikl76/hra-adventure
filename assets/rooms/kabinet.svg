  <polygon points="792,368 828,372 862,420 808,428" fill="#4a3c22" stroke="#c9a45c" stroke-width="1.5"/>
  <circle cx="836" cy="421" r="9" fill="#ffe2a8"/>

  <!-- Model paže: loket 910, úpon svalu 926 (3 cm), střed závaží 1070 (30 cm) -->
  <rect x="880" y="505" width="60" height="10" rx="2" fill="#3a3a36"/>
  <rect x="905" y="478" width="10" height="28" fill="#55524a"/>
  <rect x="897" y="355" width="26" height="110" rx="12" fill="#bfae95"/>
  <circle cx="910" cy="360" r="16" fill="#bfae95"/>
  <path d="M916,372 C 940,395 940,440 928,462 L 921,462 C 926,440 924,400 912,380 Z" fill="#8a4a3a"/>
  <polygon points="910,457 1060,460 1060,474 910,480" fill="#bfae95"/>
  <circle cx="910" cy="468" r="13" fill="#a8967c" stroke="#6a5d4a" stroke-width="2"/>
  <circle cx="926" cy="462" r="4" fill="#e6c67e"/>
  <ellipse cx="1066" cy="466" rx="14" ry="10" fill="#bfae95"/>
  <circle cx="1070" cy="442" r="18" fill="url(#metal)"/>

