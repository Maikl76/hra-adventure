      <line x1="1399" y1="180" x2="1399" y2="690"/><line x1="1447" y1="180" x2="1447" y2="690"/>
    </g>
    <rect x="1250" y="350" width="250" height="16" fill="#1b1b1a"/>
    <rect x="1250" y="600" width="250" height="16" fill="#1b1b1a"/>
    <g fill="#3a3a37">
      <circle cx="1275" cy="358" r="3"/><circle cx="1327" cy="358" r="3"/><circle cx="1375" cy="358" r="3"/><circle cx="1423" cy="358" r="3"/><circle cx="1475" cy="358" r="3"/>
      <circle cx="1275" cy="608" r="3"/><circle cx="1327" cy="608" r="3"/><circle cx="1375" cy="608" r="3"/><circle cx="1423" cy="608" r="3"/><circle cx="1475" cy="608" r="3"/>
