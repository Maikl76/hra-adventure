  <path d="M1235,690 L1235,305 A140,140 0 0 1 1515,305 L1515,690 Z" fill="#2a2520" stroke="#3d352c" stroke-width="3"/>
  <path d="M1255,690 L1255,310 A120,120 0 0 1 1495,310 L1495,690 Z" fill="url(#doorwood)"/>
