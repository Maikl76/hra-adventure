<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">
  <!-- GSPORT LEVEL 2 – kovové dveře v neonovém rámu s číselníkem, monitor, věšák s VR brýlemi, páska JUMP ZONE. Zástupná kresba. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1724"/>
      <stop offset="1" stop-color="#0f0d14"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2616"/>
      <stop offset="1" stop-color="#22160c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1418"/>
      <stop offset="1" stop-color="#08070a"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1672" height="941">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1672" height="820" fill="url(#wall)"/>
  <rect y="560" width="1672" height="260" fill="url(#wood)"/>
  <g stroke="#160e07" stroke-width="3">
    <line x1="0" y1="560" x2="1672" y2="560"/>
    <line x1="140" y1="560" x2="140" y2="820"/><line x1="420" y1="560" x2="420" y2="820"/><line x1="700" y1="560" x2="700" y2="820"/>
    <line x1="980" y1="560" x2="980" y2="820"/><line x1="1260" y1="560" x2="1260" y2="820"/><line x1="1540" y1="560" x2="1540" y2="820"/>
  </g>
  <rect y="820" width="1672" height="121" fill="url(#floor)"/>
  <line x1="0" y1="820" x2="1672" y2="820" stroke="#05040a" stroke-width="4"/>

  <!-- nápis LEVEL 2 nad dveřmi -->
  <text x="836" y="92" font-family="Arial Black, Arial" font-weight="bold" font-size="54" fill="#ff4fd8" text-anchor="middle" letter-spacing="6" opacity="0.5" filter="url(#glow)">LEVEL 2</text>
  <text x="836" y="92" font-family="Arial Black, Arial" font-weight="bold" font-size="54" fill="#ffd0f3" text-anchor="middle" letter-spacing="6">LEVEL 2</text>
  <!-- dveře v neonovém rámu -->
  <rect x="600" y="110" width="470" height="720" fill="#2a2d33" stroke="#0d0e10" stroke-width="5"/>
  <rect x="630" y="140" width="410" height="300" fill="none" stroke="#1d1f23" stroke-width="4"/>
  <rect x="630" y="470" width="410" height="330" fill="none" stroke="#1d1f23" stroke-width="4"/>
  <rect x="990" y="470" width="20" height="70" rx="6" fill="#55595e"/>
  <line x1="600" y1="110" x2="1070" y2="110" stroke="#3fe0ff" stroke-width="15" opacity="0.45" filter="url(#glow)" stroke-linecap="round"/>
  <line x1="600" y1="110" x2="1070" y2="110" stroke="#3fe0ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="600" y1="110" x2="600" y2="830" stroke="#3fe0ff" stroke-width="15" opacity="0.45" filter="url(#glow)" stroke-linecap="round"/>
  <line x1="600" y1="110" x2="600" y2="830" stroke="#3fe0ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="1070" y1="110" x2="1070" y2="830" stroke="#3fe0ff" stroke-width="15" opacity="0.45" filter="url(#glow)" stroke-linecap="round"/>
  <line x1="1070" y1="110" x2="1070" y2="830" stroke="#3fe0ff" stroke-width="5" stroke-linecap="round"/>

  <!-- číselník -->
  <rect x="1110" y="400" width="80" height="120" rx="8" fill="#0a0c10" stroke="#3fe0ff" stroke-width="3"/>
  <rect x="1122" y="412" width="56" height="20" fill="#05202a"/>
  <g fill="#1d5b6b">
    <rect x="1122" y="442" width="14" height="14"/><rect x="1143" y="442" width="14" height="14"/><rect x="1164" y="442" width="14" height="14"/>
    <rect x="1122" y="463" width="14" height="14"/><rect x="1143" y="463" width="14" height="14"/><rect x="1164" y="463" width="14" height="14"/>
    <rect x="1122" y="484" width="14" height="14"/><rect x="1143" y="484" width="14" height="14"/><rect x="1164" y="484" width="14" height="14"/>
  </g>
  <!-- monitor -->
  <rect x="160" y="220" width="300" height="200" rx="8" fill="#06090d" stroke="#333" stroke-width="6"/>
  <g fill="#1d5b6b"><rect x="185" y="250" width="180" height="10"/><rect x="185" y="275" width="220" height="10"/><rect x="185" y="320" width="150" height="10" fill="#6b2a5c"/><rect x="185" y="345" width="190" height="10"/></g>
  <rect x="290" y="420" width="40" height="40" fill="#222"/><rect x="250" y="460" width="120" height="12" fill="#222"/>
  <!-- věšák s VR brýlemi a mikinou -->
  <rect x="1330" y="290" width="12" height="20" fill="#555"/>
  <rect x="1300" y="320" width="80" height="44" rx="14" fill="#222" stroke="#444" stroke-width="3"/>
  <circle cx="1322" cy="342" r="11" fill="#0a1a22"/><circle cx="1358" cy="342" r="11" fill="#0a1a22"/>
  <path d="M1340,320 L1340,300" stroke="#444" stroke-width="4"/>
  <path d="M1290,370 L1400,370 L1420,540 L1270,540 Z" fill="#2a2244" stroke="#120e22" stroke-width="3"/>
  <text x="1345" y="470" font-family="Arial" font-weight="bold" font-size="20" fill="#3fe0ff" text-anchor="middle" opacity="0.7">GSPORT</text>
  <!-- páska JUMP ZONE -->
  <defs><clipPath id="tape"><rect x="520" y="850" width="630" height="65"/></clipPath></defs>
  <polygon points="520,850 1150,850 1150,915 520,915" fill="#c9a800"/>
  <g clip-path="url(#tape)">
    <polygon points="520,850 540,850 520,915 500,915" fill="#111"/>
    <polygon points="560,850 580,850 560,915 540,915" fill="#111"/>
    <polygon points="600,850 620,850 600,915 580,915" fill="#111"/>
    <polygon points="640,850 660,850 640,915 620,915" fill="#111"/>
    <polygon points="680,850 700,850 680,915 660,915" fill="#111"/>
    <polygon points="720,850 740,850 720,915 700,915" fill="#111"/>
    <polygon points="760,850 780,850 760,915 740,915" fill="#111"/>
    <polygon points="800,850 820,850 800,915 780,915" fill="#111"/>
    <polygon points="840,850 860,850 840,915 820,915" fill="#111"/>
    <polygon points="880,850 900,850 880,915 860,915" fill="#111"/>
    <polygon points="920,850 940,850 920,915 900,915" fill="#111"/>
    <polygon points="960,850 980,850 960,915 940,915" fill="#111"/>
    <polygon points="1000,850 1020,850 1000,915 980,915" fill="#111"/>
    <polygon points="1040,850 1060,850 1040,915 1020,915" fill="#111"/>
    <polygon points="1080,850 1100,850 1080,915 1060,915" fill="#111"/>
    <polygon points="1120,850 1140,850 1120,915 1100,915" fill="#111"/>
    <polygon points="1160,850 1180,850 1160,915 1140,915" fill="#111"/>
  </g>
  <rect x="740" y="862" width="190" height="40" fill="#c9a800"/>
  <text x="835" y="891" font-family="Arial Black, Arial" font-weight="bold" font-size="24" fill="#111" text-anchor="middle">JUMP ZONE</text>
</svg>
