<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941">
  <!-- Výstrojní sklad – regály s výstrojí a plechová skříňka. Zástupná kresba (1672 × 941),
       viz docs/zadani-obrazku-sklad.md. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34352b"/>
      <stop offset="1" stop-color="#1e1f18"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26251f"/>
      <stop offset="1" stop-color="#0d0d0b"/>
    </linearGradient>
    <linearGradient id="olive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f6642"/>
      <stop offset="1" stop-color="#383d25"/>
    </linearGradient>
    <linearGradient id="locker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c5342"/>
      <stop offset="0.6" stop-color="#5b6350"/>
      <stop offset="1" stop-color="#3b4133"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4a2b"/>
      <stop offset="1" stop-color="#3d2a17"/>
    </linearGradient>
  </defs>

  <rect width="1672" height="820" fill="url(#wall)"/>
  <rect y="820" width="1672" height="121" fill="url(#floor)"/>
  <line x1="0" y1="820" x2="1672" y2="820" stroke="#141410" stroke-width="4"/>

  <!-- mrtvá zářivka -->
  <rect x="640" y="12" width="390" height="26" rx="6" fill="#2a2a24"/>
  <rect x="652" y="18" width="366" height="12" rx="6" fill="#5a5a52"/>

  <!-- regál -->
  <g fill="#3a3c33" stroke="#1d1e18" stroke-width="2">
    <rect x="70" y="80" width="16" height="740"/><rect x="300" y="80" width="12" height="740"/>
    <rect x="530" y="80" width="12" height="740"/><rect x="744" y="80" width="16" height="740"/>
    <rect x="70" y="90" width="690" height="12"/><rect x="70" y="230" width="690" height="14"/>
    <rect x="70" y="470" width="690" height="14"/><rect x="70" y="700" width="690" height="14"/>
  </g>

  <!-- přilby -->
  <g fill="url(#olive)" stroke="#20231a" stroke-width="2">
    <path d="M100,230 A55,48 0 0 1 210,230 Z"/><path d="M220,230 A50,46 0 0 1 320,230 Z"/>
    <path d="M335,230 A55,48 0 0 1 445,230 Z"/><path d="M455,230 A52,44 0 0 1 559,230 Z"/>
    <path d="M570,230 A55,48 0 0 1 680,230 Z"/>
  </g>
  <path d="M470,205 L490,215 L500,200" fill="none" stroke="#1a1c14" stroke-width="4"/>

  <!-- batohy -->
  <g fill="url(#olive)" stroke="#20231a" stroke-width="3">
    <rect x="95" y="300" width="160" height="170" rx="28"/>
    <rect x="330" y="320" width="170" height="150" rx="26"/>
    <rect x="565" y="290" width="160" height="180" rx="28"/>
    <rect x="100" y="540" width="170" height="160" rx="26"/>
    <rect x="330" y="560" width="180" height="140" rx="26"/>
  </g>
  <g fill="none" stroke="#2a2d1d" stroke-width="6">
    <path d="M130,300 L130,260"/><path d="M220,300 L220,260"/>
    <path d="M370,320 L370,285"/><path d="M460,320 L460,285"/>
    <path d="M600,290 L600,255"/><path d="M690,290 L690,255"/>
  </g>
  <g fill="#c9c0a0">
    <rect x="160" y="400" width="34" height="20"/><rect x="398" y="410" width="34" height="20"/>
    <rect x="628" y="400" width="34" height="20"/><rect x="168" y="630" width="34" height="20"/>
    <rect x="404" y="635" width="34" height="20"/>
  </g>
  <!-- prázdné místo na batoh -->
  <rect x="565" y="540" width="160" height="160" rx="26" fill="none" stroke="#4a4c3e" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- krabice dole -->
  <g fill="#4a3b26" stroke="#24190c" stroke-width="2">
    <rect x="100" y="740" width="180" height="80"/><rect x="330" y="755" width="160" height="65"/><rect x="560" y="745" width="170" height="75"/>
  </g>

  <!-- boty na bedně -->
  <g fill="#1e1a16" stroke="#0b0a08" stroke-width="2">
    <path d="M840,640 L840,566 L880,566 L884,610 L940,622 L944,640 Z"/>
    <path d="M950,640 L950,566 L990,566 L994,610 L1050,622 L1054,640 Z"/>
  </g>
  <!-- bedna -->
  <rect x="800" y="640" width="260" height="180" fill="url(#wood)" stroke="#24190c" stroke-width="3"/>
  <g stroke="#2d1f10" stroke-width="2"><line x1="800" y1="700" x2="1060" y2="700"/><line x1="800" y1="760" x2="1060" y2="760"/></g>
  <text x="930" y="742" font-family="Arial, sans-serif" font-weight="bold" font-size="34" fill="#cfc59f" opacity="0.65" text-anchor="middle" letter-spacing="4">VÝSTROJ</text>

  <!-- plechová skříňka -->
  <rect x="1120" y="140" width="300" height="680" fill="url(#locker)" stroke="#23271c" stroke-width="4"/>
  <g stroke="#2b3024" stroke-width="5">
    <line x1="1170" y1="180" x2="1370" y2="180"/><line x1="1170" y1="196" x2="1370" y2="196"/>
    <line x1="1170" y1="212" x2="1370" y2="212"/><line x1="1170" y1="228" x2="1370" y2="228"/>
    <line x1="1170" y1="740" x2="1370" y2="740"/><line x1="1170" y1="756" x2="1370" y2="756"/>
  </g>
  <rect x="1360" y="440" width="40" height="70" rx="4" fill="#1d1f1a" stroke="#8c8a74" stroke-width="2"/>
  <g fill="#bdb79a"><rect x="1368" y="450" width="24" height="12"/><rect x="1368" y="468" width="24" height="12"/><rect x="1368" y="486" width="24" height="12"/></g>
  <rect x="1300" y="520" width="18" height="60" rx="4" fill="#2a2d24"/>
</svg>
